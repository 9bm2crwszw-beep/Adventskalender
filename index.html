<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventskalender für Grundschulen – Medienzentrum</title>
<style>
  :root{ --gold:#f5c96a; --text:#fff8ec; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#06111a}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text)}
  #szene,#bgvideo{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #bgvideo{object-fit:cover;display:none}

  #kopf{position:absolute;top:0;left:0;right:0;z-index:2;text-align:center;pointer-events:none;
        padding:clamp(10px,2.2vh,22px) 12px 0}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:normal;letter-spacing:.02em;
     font-size:clamp(24px,4.4vw,46px);text-shadow:0 2px 18px rgba(255,200,120,.45),0 2px 4px rgba(0,0,0,.7)}
  #kopf p{margin-top:2px;font-size:clamp(12px,1.6vw,15px);opacity:.92;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.6)}

  /* Türchen: transparent, nur Rahmen und Zahl */
  #kalender{position:absolute;inset:0;z-index:3;pointer-events:none}
  .tuer{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);
        background:transparent;border:2px solid rgba(245,201,106,.85);border-radius:12px;cursor:pointer;
        box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.35);
        display:flex;align-items:center;justify-content:center;flex-direction:column;
        color:var(--gold);font:inherit;transition:transform .25s,border-color .25s,box-shadow .25s}
  .tuer .nr{font-family:Georgia,"Times New Roman",serif;font-size:var(--fs,32px);line-height:1;
            text-shadow:0 0 3px #000,0 0 8px rgba(0,0,0,.9),0 2px 3px #000}
  .tuer .schloss{display:none;flex-direction:column;align-items:center;gap:2px;font-size:calc(var(--fs,32px)*.62);line-height:1}
  .tuer .schloss small{font-size:11px;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000;white-space:nowrap}
  .tuer:hover,.tuer:focus-visible,.tuer:focus-within,.tuer.aktiv{transform:translate(-50%,-50%) scale(1.1);border-color:#ffe6a3;outline:none;
        box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 18px rgba(255,214,120,.55)}
  .tuer.gesperrt:hover .nr,.tuer.gesperrt:focus-visible .nr,.tuer.gesperrt.aktiv .nr{display:none}
  .tuer.gesperrt:hover .schloss,.tuer.gesperrt:focus-visible .schloss,.tuer.gesperrt.aktiv .schloss{display:flex}
  .tuer.bereit{border-color:#ffe6a3;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 12px rgba(255,214,120,.45)}
  @keyframes leuchten{50%{border-color:#ffe6a3;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 16px rgba(255,214,120,.6)}}
  .tuer.offen{border-style:dashed;border-color:rgba(255,255,255,.7)}
  .tuer.offen::after{content:"✓";position:absolute;top:2px;right:5px;font-size:12px;color:#fff;text-shadow:0 0 3px #000}
  .tuer.wackeln{animation:wackeln .45s}
  @keyframes wackeln{25%{transform:translate(-50%,-50%) rotate(-8deg)}50%{transform:translate(-50%,-50%) rotate(7deg)}75%{transform:translate(-50%,-50%) rotate(-4deg)}}

  /* Inhalt direkt im Türchen beim Überfahren */
  .tuer{width:var(--w);height:var(--h);transition:transform .25s,border-color .25s,box-shadow .25s,width .25s,height .25s,background-color .25s}
  .tuer .inhalt{display:none;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 8px;text-align:center;width:100%}
  .tuer .knr{font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1;color:var(--gold)}
  .tuer .titel{font-size:12.5px;font-weight:600;line-height:1.2;color:#fff;
               display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .tuer .inhalt a{font-size:12px;font-weight:700;color:#fff;background:#b3263a;padding:5px 13px;border-radius:999px;text-decoration:none;white-space:nowrap}
  .tuer .inhalt a:hover,.tuer .inhalt a:focus-visible{background:#d23048;outline:2px solid #fff;outline-offset:2px}
  .tuer:not(.gesperrt):is(:hover,:focus-within,.aktiv){width:max(var(--w),160px);height:auto;min-height:max(var(--h),122px);z-index:6;
        transform:translate(calc(-50% + var(--dx,0px)),-50%);background:rgba(8,16,24,.8);animation:none}
  .tuer:not(.gesperrt):is(:hover,:focus-within,.aktiv) .nr{display:none}
  .tuer:not(.gesperrt):is(:hover,:focus-within,.aktiv) .inhalt{display:flex}
  .tuer.offen:is(:hover,:focus-within,.aktiv)::after{display:none}

  #hinweis{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:11;
           background:rgba(8,16,24,.92);border:1px solid rgba(245,201,106,.6);color:var(--text);
           padding:10px 18px;border-radius:999px;font-size:14px;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
  #hinweis.zeigen{opacity:1;transform:translateX(-50%) translateY(0)}
  #logo{position:fixed;left:clamp(10px,1.6vw,22px);top:clamp(10px,1.6vw,20px);z-index:4;width:clamp(64px,9vw,120px);height:auto;
         pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
  @media (max-width:640px){ #kopf{padding-top:58px} #logo{width:64px} }
  footer{position:fixed;right:15px;bottom:5px;z-index:2;font-size:9.5pt;opacity:.6;color:#3a2a1a}
  footer a{color:inherit;text-decoration:none}
  footer a:hover,footer a:focus-visible{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){.tuer{transition:none}}
</style>
</head>

function heute(){
  const s = TESTDATUM || new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());

  const basis=Math.max(40,Math.min(96,Math.min(cw,ch)*.62)), w=Math.min(cw*.9,basis*1.12), h=basis*.98, fs=Math.round(basis*.44);
  // Zahlen zufällig auf die Felder verteilen, Position nur leicht versetzt
  const reihenfolge=[...Array(24).keys()];
  for(let i=23;i>0;i--){ const j=Math.floor(rn()*(i+1)); [reihenfolge[i],reihenfolge[j]]=[reihenfolge[j],reihenfolge[i]]; }
  reihenfolge.forEach((z,i)=>{
    const el=tueren[i], c=z%cols, rr=Math.floor(z/cols);
    const jx=(cw-w)/2*.22*(rn()*2-1), jy=(ch-h)/2*.22*(rn()*2-1);
    el.style.left=(rand+cw*(c+.5)+jx)+"px"; el.style.top=(oben+ch*(rr+.5)+jy)+"px";

  });
  verstecken();
}

      gw={x:x+w/2-w*.09,y:top-gh*.7,w:w*.18,h:gh*.42,bogen:true};

    if(gw) fenster.push(neuesFenster(gw,rahmen));

          for(let k=0;k<4;k++){ v.fillStyle=pick(["#c8302c","#f2f0ea","#e14a3c"]); v.beginPath(); v.arc(fx+r(0,fw),fy+fh+r(0,3)*S,1.8*S,0,6.28); v.fill(); } }
      } }
    // Erdgeschoss: Schaufenster, Tür, Markise, Kranz
    const fr=dunkel?"#c9b98f":"#2f4f45";

    const sx=x+w*.1, sw2=w*.5, sy=GY-eg*.72, shh2=eg*.55;

    g.fillStyle="#3b2618"; const tx=x+w*.68, tw=w*.2; g.fillRect(tx,GY-eg*.72,tw,eg*.72);

    v.strokeStyle="#2e5d35"; v.lineWidth=4*S; v.beginPath(); v.arc(tx+tw/2,GY-eg*.38,tw*.24,0,6.28); v.stroke();

    if(rnd()<.5){ const ax=sx-6*S, aw=sw2+12*S, ay=sy-10*S, ah=18*S, farb=pick(["#c8302c","#2f6b55"]);

        v.moveTo(ax+aw*k/8,ay); v.lineTo(ax+aw*(k+1)/8,ay); v.lineTo(ax+aw*(k+1)/8+1*S,ay+ah); v.lineTo(ax+aw*k/8-1*S,ay+ah); v.fill(); }
      for(let k=0;k<8;k++){ v.fillStyle=k%2?"#f4ecd8":farb; v.beginPath(); v.arc(ax+aw*(k+.5)/8,ay+ah,aw/16,0,3.14); v.fill(); } }

  const AUS=.06;

  /* ---------------- Marktstand ---------------- */
  function stand(g,x,base,w){
    const hh=96*S, dach=34*S, top=base-hh, theke=38*S, holz=pick(["#7a4a2a","#8a5631","#6b4024"]), dachF=pick(["#7a2a22","#2f5a4e","#5b3a24"]);
    const innen=g.createLinearGradient(0,top+dach,0,base-theke); innen.addColorStop(0,"#ffd98a"); innen.addColorStop(1,"#e09a48");
    g.fillStyle=innen; g.fillRect(x+6*S,top+dach-4*S,w-12*S,hh-dach-theke+6*S);
    // Regale mit Waren
    for(let rr=0;rr<2;rr++){ const ry=top+dach+12*S+rr*15*S; g.fillStyle="rgba(90,50,20,.6)"; g.fillRect(x+8*S,ry+7*S,w-16*S,2*S);
      for(let k=x+12*S;k<x+w-14*S;k+=r(7,11)*S){ g.fillStyle=pick(["#c8302c","#2f6b55","#e0b040","#f2ecdc","#8a4a2a","#d96a7a"]); g.fillRect(k,ry+7*S-r(5,8)*S,r(4,6)*S,r(5,8)*S); } }
    // Pfosten
    g.fillStyle=holz; g.fillRect(x+1*S,top+dach-6*S,6*S,hh-dach+6*S); g.fillRect(x+w-7*S,top+dach-6*S,6*S,hh-dach+6*S);
    // Theke
    g.fillStyle=holz; g.fillRect(x,base-theke,w,theke);
    g.strokeStyle="rgba(0,0,0,.22)"; g.lineWidth=1; for(let k=x+10*S;k<x+w;k+=10*S){ g.beginPath(); g.moveTo(k,base-theke); g.lineTo(k,base); g.stroke(); }
    g.fillStyle="#a8703f"; g.fillRect(x-4*S,base-theke-5*S,w+8*S,6*S);
    g.fillStyle="#f4f1ea"; g.fillRect(x-4*S,base-theke-7*S,w+8*S,2.5*S);
    // Waren auf der Theke
    for(let k=x+8*S;k<x+w-14*S;k+=r(12,20)*S){ const t=rnd();
      if(t<.4){ g.fillStyle="#8a4a22"; herz(g,k+5*S,base-theke-12*S,6*S); }
      else if(t<.7){ g.fillStyle=pick(["#c8302c","#e8e2d0","#2f6b55"]); g.fillRect(k,base-theke-16*S,6*S,10*S); g.fillStyle="#fff"; g.fillRect(k,base-theke-16*S,6*S,2*S); }
      else { g.fillStyle=pick(["#e0b040","#c8302c","#d96a7a"]); g.beginPath(); g.arc(k+4*S,base-theke-10*S,4*S,0,6.28); g.fill(); } }
    // Dach
    g.fillStyle=dachF; g.beginPath(); g.moveTo(x-12*S,top+dach); g.lineTo(x+w/2,top); g.lineTo(x+w+12*S,top+dach); g.fill();
    g.fillStyle="#f4f4f0"; g.beginPath(); g.moveTo(x-14*S,top+dach-3*S); g.lineTo(x+w/2,top-4*S); g.lineTo(x+w+14*S,top+dach-3*S);
    g.lineTo(x+w+4*S,top+dach-9*S); g.lineTo(x+w/2,top+5*S); g.lineTo(x-4*S,top+dach-9*S); g.fill();
    // Volant
    const vn=Math.round(w/(11*S));
    for(let k=0;k<vn;k++){ g.fillStyle=k%2?"#f4ecd8":"#c8302c"; g.beginPath(); g.arc(x+w*(k+.5)/vn,top+dach,w/vn/2,0,3.14); g.fill(); }

    g.fillStyle="#2d5a36"; g.beginPath(); g.ellipse(x+w/2,top+dach*.62,9*S,5*S,0,0,6.28); g.fill();
    g.fillStyle="#c8302c"; g.beginPath(); g.arc(x+w/2,top+dach*.62,2.5*S,0,6.28); g.fill();
    // Lichterkette an der Dachkante
    for(let k=0;k<=9;k++){ const t=k/9, lx=x-8*S+(w+16*S)*t, ly=top+dach-1*S-(1-Math.abs(t*2-1))*(dach-4*S)+3*S; standLichter.push({x:lx,y:ly,p:r(0,6.28)}); }
  }
  function herz(g,x,y,s){ g.beginPath(); g.moveTo(x,y+s*.9); g.bezierCurveTo(x-s*1.2,y,x-s*.6,y-s*.8,x,y-s*.2); g.bezierCurveTo(x+s*.6,y-s*.8,x+s*1.2,y,x,y+s*.9); g.fill(); }

  /* ---------------- Weihnachtsbaum ---------------- */
  function tanne(g){
    const mx=W/2, base=GY+46*S, th=Math.min(H*.66,base-H*.08), tip=base-th, tw=th*.58;
    spitze={x:mx,y:tip};

    const n=9;
    for(let i=n-1;i>=0;i--){
      const yT=tip+th*.9*(i/n)*.9, yB=tip+th*.92*((i+1)/n), hwT=tw/2*(i/n)*.55, hwB=tw/2*((i+1)/n);
      const gr=g.createLinearGradient(mx-hwB,0,mx+hwB,0); gr.addColorStop(0,"#123a26"); gr.addColorStop(.5,"#2b6a43"); gr.addColorStop(1,"#0f3221");

    }

    for(let i=0,k=Math.round(1100*S);i<k;i++){ const f=Math.sqrt(rnd())*.92, y=tip+th*f, hw=tw/2*f*.95, x=mx+r(-hw,hw);
      g.strokeStyle=pick(["rgba(70,140,90,.55)","rgba(15,50,30,.6)","rgba(110,170,110,.35)"]); g.lineWidth=1.3*S;
      const s=x<mx?-1:1; g.beginPath(); g.moveTo(x,y); g.lineTo(x+s*r(3,7)*S,y+r(2,5)*S); g.stroke(); }
    // Kugeln & Sterne
    for(let i=0,k=Math.round(30*S+8);i<k;i++){ const f=r(.12,.9), y=tip+th*f, hw=tw/2*f*.8, x=mx+r(-hw,hw), rr=r(3,5.5)*S;
      g.fillStyle=pick(["#c8302c","#e0b040","#d96a7a","#e8e2d0","#b82a2a"]); g.beginPath(); g.arc(x,y,rr,0,6.28); g.fill();
      g.fillStyle="rgba(255,255,255,.7)"; g.beginPath(); g.arc(x-rr*.35,y-rr*.35,rr*.3,0,6.28); g.fill(); }
    for(let i=0;i<5;i++){ const f=r(.25,.85), y=tip+th*f, hw=tw/2*f*.7; stern(g,mx+r(-hw,hw),y,6*S,2.6*S,"#e9c25a",5); }
    // Lichterkette im Baum
    for(let i=0,k=Math.round(170*S+40);i<k;i++){ const f=Math.sqrt(rnd())*.9+.03, y=tip+th*f, hw=tw/2*f*.9;

    g.fillStyle="#7fa898"; g.fillRect(mx-pw/2,base-ph*.4,pw,ph);
    g.fillStyle="#9cc2b3"; g.beginPath(); g.ellipse(mx,base-ph*.4,pw/2,ph*.35,0,0,6.28); g.fill();
    for(let i=0;i<6;i++){ const bw=r(12,22)*S, bx=mx+r(-pw*.4,pw*.4-bw), bh=r(10,18)*S, by=base-ph*.4-bh+r(0,4)*S;
      g.fillStyle=pick(["#c8302c","#e0b040","#2f6b55","#f0e6d0"]); g.fillRect(bx,by,bw,bh);
      g.fillStyle="#f6e7b0"; g.fillRect(bx+bw/2-1.5*S,by,3*S,bh); }

  }
  function stern(g,x,y,R,ri,farbe,n){ g.fillStyle=farbe; g.beginPath();
    for(let i=0;i<n*2;i++){ const a=-Math.PI/2+i*Math.PI/n, rr=i%2?ri:R; g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } g.closePath(); g.fill(); }

  function kahlerBaum(g,x,y){ g.lineCap="round";
    const ast=(x,y,l,a,d)=>{ const x2=x+Math.cos(a)*l,y2=y+Math.sin(a)*l;

      if(d<5&&rnd()<.7){ g.strokeStyle="rgba(255,255,255,.85)"; g.lineWidth=Math.max(.8,d*.6*S); g.beginPath(); g.moveTo(x,y-1); g.lineTo(x2,y2-1); g.stroke(); }
      if(d>0){ ast(x2,y2,l*r(.66,.8),a-r(.25,.6),d-1); ast(x2,y2,l*r(.66,.8),a+r(.25,.6),d-1); if(rnd()<.3) ast(x2,y2,l*.6,a+r(-.2,.2),d-1); } };

  function laterne(g,x,y){ const hh=150*S;
    g.fillStyle="#22352f"; g.fillRect(x-2.5*S,y-hh,5*S,hh); g.fillRect(x-7*S,y-8*S,14*S,8*S); g.fillRect(x-5*S,y-hh*.55,10*S,4*S);

    laternen.push({x,y:ly+11*S,p:r(0,6.28)});

  /* ---------------- Menschen & Hunde ---------------- */
  const MANTEL=["#8a2a24","#2f5a4e","#c26a3a","#3b3b46","#a8773a","#6b2a3a","#d9c7a0","#2b4a6b","#b8442f","#4f6b3a"];
  const HAUT=["#f1c7a5","#e0a982","#c68a5e","#8d5a3b","#f5d6bc"];
  function neuePerson(){
    const d=rnd(), kind=rnd()<.25, p=S*(.75+.6*d);
    const m={x:r(-40,W+40), y:YMIN+d*Math.max(10,H-YMIN-8*S), p, kind, h:(kind?44:66)*p,
      dir:rnd()<.5?-1:1, tempo:r(16,30)*p, laeuft:rnd()<.72, timer:r(3,20), ph:r(0,6.28),
      mantel:pick(MANTEL), haut:pick(HAUT), haar:pick(["#2b1d14","#5a3a22","#b08850","#1b1b1b","#8b8b8b"]),
      hut:Math.floor(rnd()*4), hutF:pick(["#c8302c","#2f6b55","#efe3c4","#3b3b46","#b8442f"]), schal:pick(["#c8302c","#efe3c4","#2f6b55","#e0b040"])};
    m.hund = !kind && rnd()<.18 ? {farbe:pick(["#a0612f","#c99a5b","#e8dcc6","#3a2a22"])} : null;
    return m;
  }
  function person(m,t){
    const h=m.h, x=m.x, y=m.y, ph=m.laeuft? m.ph : 0;
    const sw=m.laeuft?Math.sin(ph)*.42:0, bob=m.laeuft?Math.abs(Math.cos(ph))*h*.02:Math.sin(t*1.6+m.x)*h*.006;
    const hip=y-h*.40-bob, sh=y-h*.80-bob, ky=y-h*.89-bob, hr=h*.085;
    cx.fillStyle="rgba(60,45,30,.16)"; cx.beginPath(); cx.ellipse(x,y+1,h*.17,h*.035,0,0,6.28); cx.fill();
    if(m.hund) hund(m,t);
    cx.save(); cx.translate(x,0); cx.scale(m.dir,1); cx.translate(-x,0);   // Blickrichtung = Laufrichtung
    cx.lineCap="round"; cx.strokeStyle="#2b2622"; cx.lineWidth=h*.07;
    [1,-1].forEach(s=>{ const l=y-hip; cx.beginPath(); cx.moveTo(x,hip); cx.lineTo(x+Math.sin(sw*s)*l,hip+Math.cos(sw*s)*l); cx.stroke(); });
    // Mantel
    cx.fillStyle=m.mantel; cx.beginPath(); cx.moveTo(x-h*.1,sh); cx.lineTo(x+h*.1,sh);
    cx.lineTo(x+h*.15,y-h*.34-bob); cx.quadraticCurveTo(x,y-h*.31-bob,x-h*.15,y-h*.34-bob); cx.closePath(); cx.fill();
    // Arm
    cx.strokeStyle=shade(m.mantel); cx.lineWidth=h*.07; const al=h*.3;
    cx.beginPath(); cx.moveTo(x,sh+h*.03); cx.lineTo(x+Math.sin(-sw*.8)*al,sh+h*.03+Math.cos(sw*.8)*al); cx.stroke();
    // Schal
    cx.fillStyle=m.schal; cx.fillRect(x-h*.085,sh-h*.035,h*.17,h*.06); cx.fillRect(x-h*.06,sh,h*.045,h*.13);
    // Kopf
    cx.fillStyle=m.haut; cx.beginPath(); cx.arc(x,ky,hr,0,6.28); cx.fill();
    cx.beginPath(); cx.arc(x+hr*.95,ky+hr*.1,hr*.28,0,6.28); cx.fill();   // Nase zeigt die Blickrichtung
    if(m.hut===0){ cx.fillStyle=m.haar; cx.beginPath(); cx.arc(x,ky-hr*.15,hr*1.02,Math.PI,0); cx.fill(); }
    else if(m.hut===1){ cx.fillStyle=m.hutF; cx.beginPath(); cx.arc(x,ky-hr*.1,hr*1.08,Math.PI,0); cx.fill();
      cx.fillStyle="#f4f0e6"; cx.beginPath(); cx.arc(x,ky-hr*1.2,hr*.35,0,6.28); cx.fill(); }
    else if(m.hut===2){ cx.fillStyle="#2a2522"; cx.fillRect(x-hr*1.4,ky-hr*.55,hr*2.8,hr*.3); cx.beginPath(); cx.arc(x,ky-hr*.55,hr*.85,Math.PI,0); cx.fill(); }
    else { cx.fillStyle=m.hutF; cx.beginPath(); cx.ellipse(x-hr*.2,ky-hr*.55,hr*1.15,hr*.45,.15,0,6.28); cx.fill(); }
    cx.restore();
  }
  function hund(m,t){
    const p=m.h, x=m.x+m.dir*p*.42, y=m.y+p*.03, sw=m.laeuft?Math.sin(m.ph*1.4)*.5:0, F=m.hund.farbe;
    cx.strokeStyle="rgba(40,30,20,.6)"; cx.lineWidth=1; cx.beginPath(); cx.moveTo(m.x+m.dir*p*.1,m.y-p*.5); cx.quadraticCurveTo(x,y-p*.35,x+m.dir*p*.1,y-p*.22); cx.stroke();
    cx.strokeStyle=shade(F); cx.lineWidth=p*.035; cx.lineCap="round";
    [[-.08,1],[-.05,-1],[.08,-1],[.11,1]].forEach(([o,s])=>{ cx.beginPath(); cx.moveTo(x+m.dir*p*o,y-p*.14); cx.lineTo(x+m.dir*p*o+Math.sin(sw*s)*p*.12,y); cx.stroke(); });
    cx.fillStyle=F; cx.beginPath(); cx.ellipse(x,y-p*.16,p*.13,p*.055,0,0,6.28); cx.fill();
    cx.beginPath(); cx.arc(x+m.dir*p*.14,y-p*.22,p*.05,0,6.28); cx.fill();
    cx.beginPath(); cx.ellipse(x+m.dir*p*.19,y-p*.2,p*.035,p*.022,0,0,6.28); cx.fill();
    cx.fillStyle=shade(F); cx.beginPath(); cx.ellipse(x+m.dir*p*.12,y-p*.25,p*.02,p*.035,.3*m.dir,0,6.28); cx.fill();
    cx.strokeStyle=F; cx.lineWidth=p*.025; cx.beginPath(); cx.moveTo(x-m.dir*p*.12,y-p*.17); cx.lineTo(x-m.dir*p*.19,y-p*.25+Math.sin(t*9)*p*.02); cx.stroke();
  }
  function shade(hex){ const n=parseInt(hex.slice(1),16); const f=v=>Math.round(v*.72); return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`; }



  /* ---------------- Weihnachtsmann mit Schlitten ---------------- */
  const schlitten={aktiv:false,start:7,staub:[],mal:0};
  function schlittenStart(t){
    const s=schlitten; s.aktiv=true; s.mal++; s.boden=s.mal%2===1; s.dir=Math.random()<.5?1:-1;
    s.u=s.boden?S*.95:S*.55; s.v=(s.boden?150:200)*S; s.x=s.dir>0?-60*S:W+320*s.u; s.t0=t;
  }
  function schlittenZeichnen(t,dt){
    const s=schlitten;
    if(!s.aktiv){ if(t>s.start) schlittenStart(t); return; }
    s.x+=s.dir*s.v*dt;
    const p=(t-s.t0), y=s.boden? Math.max(YMIN+40*S,H-16*S)+Math.sin(t*18)*1.2*S : H*.11+Math.sin(p*1.3)*H*.03;
    if(s.boden){ for(let k=0;k<2;k++) s.staub.push({x:s.x-s.dir*R(-5,10)*s.u,y:y-R(0,4)*S,vx:-s.dir*R(10,50)*S,vy:-R(10,35)*S,l:1,r:R(2,5)*S}); }
    zeichneSchlitten(s.x,y,s.u,s.dir,t);
    const ende=s.dir>0? s.x>W+60*S : s.x< -360*s.u;
    if(ende){ s.aktiv=false; s.start=t+R(30,60); }
  }
  function staubZeichnen(dt){
    const st=schlitten.staub; cx.fillStyle="#fff";
    for(let i=st.length-1;i>=0;i--){ const d=st[i]; d.x+=d.vx*dt; d.y+=d.vy*dt; d.vy+=40*S*dt; d.l-=dt*1.1;
      if(d.l<=0){ st.splice(i,1); continue; } cx.globalAlpha=d.l*.8; cx.beginPath(); cx.arc(d.x,d.y,d.r,0,6.28); cx.fill(); }
    cx.globalAlpha=1;
  }
  function zeichneSchlitten(x,y,u,dir,t){
    cx.save(); cx.translate(x,y); cx.scale(dir*u,u); cx.lineCap="round"; cx.lineJoin="round";
    const rentiere=[0,1,2,3].map(i=>({x:128+i*46,y:-30+(i%2)*4,ph:t*13+i*1.1}));
    // Zugleine
    cx.strokeStyle="#c9a040"; cx.lineWidth=1.6;
    rentiere.forEach(rt=>{ cx.beginPath(); cx.moveTo(76,-56); cx.quadraticCurveTo((76+rt.x)/2,-44,rt.x-6,rt.y-6); cx.stroke(); });
    cx.beginPath(); cx.moveTo(94,-24); cx.lineTo(rentiere[3].x,-28); cx.stroke();
    rentiere.forEach((rt,i)=>{
      const {x:X,y:Y,ph}=rt; cx.strokeStyle="#5a3a22"; cx.lineWidth=3.5;
      [[12,0],[8,.5],[-12,Math.PI],[-15,Math.PI+.5]].forEach(([o,ver])=>{ const a=Math.sin(ph+ver)*.6;
        cx.beginPath(); cx.moveTo(X+o,Y+4); cx.lineTo(X+o+Math.sin(a)*22,Y+4+Math.cos(a)*22); cx.stroke(); });
      cx.fillStyle="#8b5a33"; cx.beginPath(); cx.ellipse(X,Y,19,9.5,0,0,6.28); cx.fill();
      cx.fillStyle="#c99a6a"; cx.beginPath(); cx.ellipse(X,Y+4,13,4,0,0,6.28); cx.fill();
      cx.fillStyle="#8b5a33"; cx.beginPath(); cx.moveTo(X+9,Y-6); cx.lineTo(X+20,Y-22); cx.lineTo(X+27,Y-18); cx.lineTo(X+18,Y+1); cx.fill();
      cx.beginPath(); cx.ellipse(X+27,Y-22,8.5,5,.3,0,6.28); cx.fill();
      cx.fillStyle="#f3efe6"; cx.beginPath(); cx.arc(X-19,Y-4,3,0,6.28); cx.fill();
      cx.strokeStyle="#4a3020"; cx.lineWidth=2;
      [[0,0],[4,1]].forEach(([o,q])=>{ cx.beginPath(); cx.moveTo(X+23+o,Y-26); cx.lineTo(X+19+o,Y-40); cx.moveTo(X+21+o,Y-33); cx.lineTo(X+27+o,Y-38); cx.moveTo(X+20+o,Y-37); cx.lineTo(X+15+o,Y-43); cx.stroke(); });
      cx.fillStyle="#1d140c"; cx.beginPath(); cx.arc(X+29,Y-24,1.2,0,6.28); cx.fill();
      const rot=i===3; cx.fillStyle=rot?"#e3302a":"#2a1a10"; cx.beginPath(); cx.arc(X+35,Y-19,rot?3.2:2.4,0,6.28); cx.fill();
      if(rot){ cx.globalCompositeOperation="lighter"; cx.globalAlpha=.6+.3*Math.sin(t*6); cx.drawImage(glow,X+35-12,Y-19-12,24,24); cx.globalAlpha=1; cx.globalCompositeOperation="source-over"; }
      cx.strokeStyle="#b8262a"; cx.lineWidth=3; cx.beginPath(); cx.moveTo(X-4,Y-9); cx.lineTo(X-4,Y+9); cx.stroke();
      cx.fillStyle="#e8c15a"; cx.beginPath(); cx.arc(X-4,Y+9,2.3,0,6.28); cx.fill();
    });
    // Kufen
    cx.strokeStyle="#d9b24a"; cx.lineWidth=3.5; cx.beginPath(); cx.moveTo(-12,0); cx.lineTo(92,0);
    cx.quadraticCurveTo(108,0,106,-12); cx.quadraticCurveTo(104,-20,97,-16); cx.stroke();
    cx.beginPath(); cx.moveTo(10,0); cx.lineTo(10,-10); cx.moveTo(72,0); cx.lineTo(72,-10); cx.stroke();
    // Sack mit Geschenken
    cx.fillStyle="#8a5a32"; cx.beginPath(); cx.ellipse(10,-62,20,18,0,0,6.28); cx.fill();
    [["#2f6b55",-6,-86,12],["#e0b040",6,-90,11],["#c8302c",14,-82,10]].forEach(([f,a,b,s])=>{ cx.fillStyle=f; cx.fillRect(a,b,s,s); cx.fillStyle="#f6e7b0"; cx.fillRect(a+s/2-1,b,2,s); });
    // Schlitten
    const k=()=>{ cx.beginPath(); cx.moveTo(-8,-10); cx.lineTo(-14,-56); cx.quadraticCurveTo(-12,-66,-2,-62); cx.lineTo(12,-40); cx.lineTo(80,-36); cx.quadraticCurveTo(98,-36,96,-22); cx.lineTo(90,-10); cx.closePath(); };
    cx.fillStyle="#b8262a"; k(); cx.fill(); cx.strokeStyle="#e8c15a"; cx.lineWidth=2.5; k(); cx.stroke();
    cx.beginPath(); cx.moveTo(20,-28); cx.quadraticCurveTo(45,-18,70,-28); cx.stroke();
    // Weihnachtsmann
    cx.fillStyle="#c8262a"; cx.beginPath(); cx.ellipse(52,-54,16,18,0,0,6.28); cx.fill();
    cx.fillStyle="#1b1b1b"; cx.fillRect(37,-54,30,4); cx.fillStyle="#e8c15a"; cx.fillRect(49,-55,6,6);
    cx.fillStyle="#f6f3ec"; cx.fillRect(37,-40,30,4);
    cx.strokeStyle="#c8262a"; cx.lineWidth=5.5; cx.beginPath(); cx.moveTo(56,-60); cx.lineTo(74,-56); cx.stroke();
    cx.fillStyle="#1b1b1b"; cx.beginPath(); cx.arc(76,-56,3.4,0,6.28); cx.fill();
    cx.fillStyle="#f1c7a5"; cx.beginPath(); cx.arc(56,-78,8,0,6.28); cx.fill();
    cx.fillStyle="#f6f3ec"; cx.beginPath(); cx.ellipse(60,-71,8,9.5,.2,0,6.28); cx.fill();
    cx.fillStyle="#c8262a"; cx.beginPath(); cx.moveTo(47,-80); cx.lineTo(64,-82); cx.quadraticCurveTo(52,-100,40,-96); cx.fill();
    cx.fillStyle="#f6f3ec"; cx.fillRect(46,-84,19,5); cx.beginPath(); cx.arc(40,-96,3.8,0,6.28); cx.fill();
    cx.restore();
  }

  /* ---------------- Animation ---------------- */
  let last=performance.now(), T=0, naechsterWechsel=4;
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt; const t=T;
    cx.drawImage(L.himmel,0,0,W,H);
    funkel.forEach(f=>{ const k=.75+.35*Math.sin(t*1.7+f.p); cx.globalAlpha=.25*k; cx.globalCompositeOperation="lighter";
      cx.drawImage(glow,f.x-f.R*2,f.y-f.R*2,f.R*4,f.R*4); cx.globalCompositeOperation="source-over"; cx.globalAlpha=1;
      stern(cx,f.x,f.y,f.R*k,f.R*.16,"#f5d27a",4); });
    if(!ruhig && schlitten.aktiv && !schlitten.boden) schlittenZeichnen(t,dt);
    cx.drawImage(L.haeuser,0,0,W,H);

    // Licht geht sparsam an oder aus: alle paar Sekunden genau ein Fenster
    if(!ruhig && t>naechsterWechsel){ naechsterWechsel=t+R(2.5,6);
      const kand=fenster.filter(f=>!f.laden), aus=kand.filter(f=>!f.an), an=kand.filter(f=>f.an);
      const f=(aus.length/kand.length>.1 || (aus.length&&Math.random()<.5)) ? aus[Math.floor(Math.random()*aus.length)] : an[Math.floor(Math.random()*an.length)];
      if(f) f.an=!f.an; }
    fenster.forEach(f=>{
      f.cur+=((f.an?1:AUS)-f.cur)*Math.min(1,dt*5); const b=f.b*f.cur;
      cx.fillStyle="#2a1c12"; fpfad(f); cx.fill();
      cx.globalAlpha=b; cx.fillStyle=f.farbe; fpfad(f); cx.fill();
      if(f.deko>=0){ cx.globalAlpha=b*.55; cx.fillStyle="#7a3b1c";
        if(f.deko===0||f.deko===3){ cx.fillStyle="#3d5a2a"; cx.beginPath(); cx.moveTo(f.x+f.w*.5,f.y+f.h*.25); cx.lineTo(f.x+f.w*.75,f.y+f.h); cx.lineTo(f.x+f.w*.25,f.y+f.h); cx.fill(); }
        else { for(let k=0;k<3;k++){ const px=f.x+f.w*(.2+k*.3); cx.beginPath(); cx.arc(px,f.y+f.h*.5,f.w*.05,0,6.28); cx.fill(); cx.fillRect(px-f.w*.05,f.y+f.h*.58,f.w*.1,f.h*.42); } } }
      cx.globalAlpha=b*.45; cx.globalCompositeOperation="lighter";
      cx.drawImage(glow,f.x-f.w*.9,f.y-f.h*.6,f.w*2.8,f.h*2.2);
      cx.globalCompositeOperation="source-over"; cx.globalAlpha=1;
      cx.strokeStyle=f.rahmen; cx.lineWidth=Math.max(1,1.8*S); fpfad(f); cx.stroke();
      if(!f.laden){ cx.beginPath(); cx.moveTo(f.x+f.w/2,f.y+(f.bogen?f.w*.2:0)); cx.lineTo(f.x+f.w/2,f.y+f.h); cx.moveTo(f.x,f.y+f.h*.5); cx.lineTo(f.x+f.w,f.y+f.h*.5); cx.stroke(); }
      else { cx.beginPath(); cx.moveTo(f.x+f.w/3,f.y); cx.lineTo(f.x+f.w/3,f.y+f.h); cx.moveTo(f.x+f.w*2/3,f.y); cx.lineTo(f.x+f.w*2/3,f.y+f.h); cx.stroke(); }
    });
    cx.drawImage(L.vorn,0,0,W,H);
    cx.globalCompositeOperation="lighter";
    laternen.forEach(l=>{ const R2=70*S; cx.globalAlpha=.5; cx.drawImage(glow,l.x-R2,l.y-R2,R2*2,R2*2); });
    lichter.forEach(l=>{ const a=.25+.75*Math.abs(Math.sin(t*l.s+l.p)); cx.globalAlpha=a*.6; const R2=7*S; cx.drawImage(glow,l.x-R2,l.y-R2,R2*2,R2*2); });
    cx.globalAlpha=1; cx.globalCompositeOperation="source-over";
    lichter.forEach(l=>{ cx.globalAlpha=.35+.65*Math.abs(Math.sin(t*l.s+l.p)); cx.fillStyle="#fff3c0"; cx.beginPath(); cx.arc(l.x,l.y,1.5*S,0,6.28); cx.fill(); });
    cx.globalAlpha=1;
    const k=1+.08*Math.sin(t*2.2), RS=26*S*k;
    cx.globalCompositeOperation="lighter"; cx.globalAlpha=.7; cx.drawImage(glow,spitze.x-RS*2.2,spitze.y-RS*2.2,RS*4.4,RS*4.4);
    cx.globalAlpha=1; cx.globalCompositeOperation="source-over";
    cx.save(); cx.translate(spitze.x,spitze.y-4*S); cx.rotate(Math.sin(t*.5)*.04);
    stern(cx,0,0,RS*.75,RS*.12,"#f6d77c",4); cx.rotate(Math.PI/4); stern(cx,0,0,RS*.45,RS*.1,"#ffe9a8",4); cx.restore();
    // Marktstände mit Lichterketten
    cx.drawImage(L.staende,0,0,W,H);
    cx.globalCompositeOperation="lighter";
    standLichter.forEach(l=>{ cx.globalAlpha=.5+.15*Math.sin(t*1.5+l.p); const R2=9*S; cx.drawImage(glow,l.x-R2,l.y-R2,R2*2,R2*2); });
    cx.globalCompositeOperation="source-over"; cx.globalAlpha=1; cx.fillStyle="#fff1b8";
    standLichter.forEach(l=>{ cx.beginPath(); cx.arc(l.x,l.y,1.8*S,0,6.28); cx.fill(); });
    // Menschen
    leute.forEach(m=>{
      if(!ruhig){ m.timer-=dt; if(m.timer<=0){ m.laeuft=!m.laeuft; m.timer=m.laeuft?R(8,25):R(2,7); }
        if(m.laeuft){ m.x+=m.dir*m.tempo*dt; m.ph+=dt*m.tempo/(m.h*.16); } }
      if(m.x>W+60) m.x=-60; if(m.x<-60) m.x=W+60;
      person(m,t);
    });
    if(!ruhig){ staubZeichnen(dt); if(!schlitten.aktiv || schlitten.boden) schlittenZeichnen(t,dt); }
    // Schnee: gleichmäßig, sanfter Wind, seitlich umlaufend
    const wind=(Math.sin(t*.11)*.6+Math.sin(t*.037+1)*.4)*16;
    cx.fillStyle="#fff";
    flocken.forEach(f=>{
      if(!ruhig){ f.y+=f.v*dt; f.x+=(Math.sin(t*.7+f.ph)*6+wind)*(.5+f.z*.5)*dt;
        if(f.x<-6) f.x+=W+12; else if(f.x>W+6) f.x-=W+12;
        if(f.y>H+6){ f.y=-6; f.x=Math.random()*W; } }
      cx.globalAlpha=f.a; cx.beginPath(); cx.arc(f.x,f.y,f.r,0,6.28); cx.fill(); });
    cx.globalAlpha=1;
    if(!ruhig) requestAnimationFrame(frame);
  }
  function fpfad(f){ cx.beginPath();
    if(f.bogen){ const rr=f.w/2; cx.moveTo(f.x,f.y+f.h); cx.lineTo(f.x,f.y+rr); cx.arc(f.x+rr,f.y+rr,rr,Math.PI,0); cx.lineTo(f.x+f.w,f.y+f.h); cx.closePath(); }
    else cx.rect(f.x,f.y,f.w,f.h); }

  let rT; addEventListener("resize",()=>{clearTimeout(rT); rT=setTimeout(()=>{aufbauen(); if(ruhig) frame(performance.now());},150);});
  aufbauen(); requestAnimationFrame(frame);
})();
}
</script>
